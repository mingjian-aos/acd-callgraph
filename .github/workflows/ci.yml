name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 不下载 106 MB 全图：只用内置小图跑 CLI 的退出码/同名/参数错误/JSON 断言
      - name: CLI regression (no full graph needed)
        run: python scripts/smoke_test.py

      # 可选：有图时再跑全图自检（手动触发，仓库内不保存图）
      - name: Self-check on a real graph (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && vars.ACD_GRAPH_FROM_RELEASE == '1' }}
        run: |
          curl -fL -o /tmp/acd.zip "${{ vars.ACD_GRAPH_ZIP_URL }}"
          python scripts/query.py --graph /tmp/acd.zip --selfcheck
          unzip -o /tmp/acd.zip -d /tmp/acdgraph
          python scripts/verify_graph.py /tmp/acdgraph/acd_graph.json
